name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'security/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vreeo
          POSTGRES_PASSWORD: vreeo_dev_only
          POSTGRES_DB: vreeo
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U vreeo -d vreeo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate database schema and generate Prisma client
        env:
          DATABASE_URL: postgresql://vreeo:vreeo_dev_only@localhost:5432/vreeo?schema=public
        run: pnpm --filter @vreeo/database db:validate && pnpm --filter @vreeo/database db:generate
      - name: Apply migrations to a clean PostgreSQL database
        env:
          DATABASE_URL: postgresql://vreeo:vreeo_dev_only@localhost:5432/vreeo?schema=public
        run: pnpm --filter @vreeo/database db:migrate:deploy
      - name: Check formatting
        run: pnpm format:check
      - name: Quality checks
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
