services:
  postgres:
    image: postgres:17-alpine
    container_name: vreeo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vreeo
      POSTGRES_PASSWORD: vreeo_dev_only
      POSTGRES_DB: vreeo
    ports:
      - "5432:5432"
    volumes:
      - vreeo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vreeo -d vreeo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vreeo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vreeo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vreeo_postgres_data:
  vreeo_redis_data:
